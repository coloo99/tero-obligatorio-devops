# Configuracion del analisis de SonarCloud.
sonar.organization=coloo99
sonar.projectKey=coloo99_tero-obligatorio-devops
sonar.projectName=tero-obligatorio-devops

# Codigo de los 6 microservicios.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.yarn/**,**/*.lock,**/package-lock.json,**/go.sum

# Tero no tiene tests unitarios, por eso la cobertura no se mide (ver decisiones).
# El quality gate se basa en bugs, vulnerabilidades, security hotspots, code smells y duplicacion.
sonar.coverage.exclusions=**/*

# El job falla si el quality gate no pasa.
sonar.qualitygate.wait=true
sonar.sourceEncoding=UTF-8
